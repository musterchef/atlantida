[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "desnivel"
version = "0.1.0"
description = "Generative audiovisual system: GPX cycling data modulates a self-running ecosystem."
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
osc = ["python-osc>=1.8"]
dev = ["pytest>=7", "python-osc>=1.8"]

[project.scripts]
desnivel-stream-metrics = "desnivel.cli.stream_metrics:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
