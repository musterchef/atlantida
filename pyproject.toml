[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "desnivel"
version = "0.1.0"
description = "Musica generativa basata sui dati di un viaggio: traduzione delle metriche GPX in composizione musicale multivoce."
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
osc = ["python-osc>=1.8"]
dev = ["pytest>=7", "python-osc>=1.8"]

[project.scripts]
desnivel-stream-metrics = "desnivel.cli.stream_metrics:main"
desnivel-trip-music = "desnivel.cli.trip_music:main"
desnivel-live-bass = "desnivel.cli.live_bass:main"
desnivel-voice-device = "desnivel.cli.voice_device:main"
desnivel-ensemble = "desnivel.cli.ensemble:main"
desnivel-analyze-bass = "desnivel.cli.analyze_bass:main"
desnivel-capture-snake = "desnivel.cli.capture_snake:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
